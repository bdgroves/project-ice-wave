name: IceWave v5 build

on:
  workflow_dispatch:
    inputs:
      step:
        description: script under tools/v5 to run
        default: quarries.py

permissions:
  contents: write

concurrency:
  group: icewave
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q geopandas pandas numpy scipy "scikit-learn==1.9.1" rasterio pillow pyproj shapely
      - uses: actions/cache@v4
        with:
          path: /tmp/v5cache
          key: v5cache-${{ github.run_id }}
          restore-keys: v5cache-
      - name: Run tools/v5/${{ inputs.step }}
        run: set -o pipefail; python tools/v5/${{ inputs.step }} 2>&1 | tee /tmp/v5.log
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/v5/logs && cp /tmp/v5.log "data/v5/logs/${{ inputs.step }}.log"; cp /tmp/v5.log "data/v5/logs/last.log"
          git add data/v5
          git diff --staged --quiet && exit 0
          git commit -q -m "v5: ${{ inputs.step }}"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
